    //A JavaScript Promise is an object representing the eventual completion (or failure) of an asynchronous operation and its resulting value. It provides a cleaner alternative to traditional callbacks for handling asynchronous code, improving readability and avoiding "callback hell"

    //In JavaScript, a Promise object, which represents the eventual completion or failure of an asynchronous operation, can exist in one of three mutually exclusive states:

});

promise
