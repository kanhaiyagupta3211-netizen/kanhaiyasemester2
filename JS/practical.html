<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Largest Number Finder</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            text-align: center;
            margin-top: 50px;
        }

        .container {
            background: white;
            width: 400px;
            margin: auto;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 8px 0;
            font-size: 16px;
        }

        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
        }

        button:hover {
            background-color: #0056b3;
        }

        #result {
            margin-top: 15px;
            font-size: 20px;
            font-weight: bold;
            color: green;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Largest Number Finder</h2>

        <input type="number" id="num1" placeholder="Enter Number 1">
        <input type="number" id="num2" placeholder="Enter Number 2">
        <input type="number" id="num3" placeholder="Enter Number 3">
        <input type="number" id="num4" placeholder="Enter Number 4">
        <input type="number" id="num5" placeholder="Enter Number 5">

        <button onclick="findLargest()">Find Largest</button>

        <div id="result"></div>
    </div>

    <script>
        function findLargest() {
            let n1 = Number(document.getElementById("num1").value);
            let n2 = Number(document.getElementById("num2").value);
            let n3 = Number(document.getElementById("num3").value);
            let n4 = Number(document.getElementById("num4").value);
            let n5 = Number(document.getElementById("num5").value);

            let largest;

            if (n1 >= n2 && n1 >= n3 && n1 >= n4 && n1 >= n5) {
                largest = n1;
            }
            else if (n2 >= n1 && n2 >= n3 && n2 >= n4 && n2 >= n5) {
                largest = n2;
            }
            else if (n3 >= n1 && n3 >= n2 && n3 >= n4 && n3 >= n5) {
                largest = n3;
            }
            else if (n4 >= n1 && n4 >= n2 && n4 >= n3 && n4 >= n5) {
                largest = n4;
            }
            else {
                largest = n5;
            }

            document.getElementById("result").innerHTML =
                "Largest Number = " + largest;
        }
    </script>

</body>
</html>
